apiVersion: v1
kind: Namespace
metadata: {name: infragraph-collector}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: infragraph-collector, namespace: infragraph-collector}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: infragraph-collector-readonly}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services", "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: infragraph-collector-readonly}
subjects:
  - {kind: ServiceAccount, name: infragraph-collector, namespace: infragraph-collector}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: infragraph-collector-readonly}

