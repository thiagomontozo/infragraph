name: infragraph
services:
  api:
    image: ${INFRAGRAPH_API_IMAGE:?set an immutable image digest}
    restart: unless-stopped
    env_file: [.env.production]
    expose: [8080]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  web:
    image: ${INFRAGRAPH_WEB_IMAGE:?set an immutable image digest}
    restart: unless-stopped
    expose: [8080]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {INFRAGRAPH_DOMAIN: inventory.example.com}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [backend]
volumes: {caddy_data: {}, caddy_config: {}}
networks:
  backend:
    ipam: {config: [{subnet: 172.30.0.0/24}]}
