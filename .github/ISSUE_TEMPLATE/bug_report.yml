name: Bug report
description: Report a reproducible non-security defect using synthetic data.
body:
  - {type: markdown, attributes: {value: "Do not report vulnerabilities or attach secrets/real infrastructure data here. Use a private Security Advisory."}}
  - {type: input, id: version, attributes: {label: Version, placeholder: 1.0.0-rc.1}, validations: {required: true}}
  - {type: textarea, id: expected, attributes: {label: Expected behavior}, validations: {required: true}}
  - {type: textarea, id: actual, attributes: {label: Actual behavior and synthetic reproduction}, validations: {required: true}}
  - {type: textarea, id: environment, attributes: {label: Environment, description: OS, Go/Node/PostgreSQL/Docker versions; redact credentials.}}
  - {type: checkboxes, id: safe, attributes: {label: Data safety, options: [{label: I removed credentials, personal data, and real infrastructure identifiers., required: true}]}}
