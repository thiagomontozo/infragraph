name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_call:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env: {POSTGRES_DB: infragraph_test, POSTGRES_USER: infragraph, POSTGRES_PASSWORD: test-only-password}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U infragraph -d infragraph_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - name: Start S3-compatible test storage
        run: |
          docker run -d --name infragraph-ci-minio \
            --label com.infragraph.managed=true --label com.infragraph.purpose=test \
            -e MINIO_ROOT_USER=testaccess -e MINIO_ROOT_PASSWORD=testsecret-change-me \
            -p 9000:9000 minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs infragraph-ci-minio
          exit 1
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod, cache: true}
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go vet ./...
      - run: go test -count=1 -coverprofile=coverage.out ./cmd/... ./internal/...
        env:
          INFRAGRAPH_TEST_DATABASE_URL: postgres://infragraph:test-only-password@localhost:5432/infragraph_test?sslmode=disable
          INFRAGRAPH_TEST_S3_ENDPOINT: localhost:9000
      - run: go test -race -count=1 ./internal/security ./internal/reconcile ./internal/graph ./internal/resolution ./internal/imports
      - run: go build ./cmd/infragraph-api ./cmd/infragraph-collector ./cmd/infragraph-bootstrap
      - uses: actions/upload-artifact@v4
        with: {name: go-coverage, path: coverage.out, retention-days: 14}
      - name: Stop S3-compatible test storage
        if: always()
        run: |
          if docker container inspect infragraph-ci-minio >/dev/null 2>&1; then
            docker rm -f infragraph-ci-minio
          fi
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
  docker-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod, cache: true}
      - run: chmod +x scripts/e2e.sh && scripts/e2e.sh
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: web/playwright-report, retention-days: 14}
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f Dockerfile.api -t infragraph-api:test .
      - run: docker build -f Dockerfile.collector -t infragraph-collector:test .
      - run: docker build -f web/Dockerfile -t infragraph-web:test web
