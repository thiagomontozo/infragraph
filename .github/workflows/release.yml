name: Release
on:
  push: {tags: ['v*']}
  workflow_dispatch: {inputs: {tag: {description: Existing v* tag to release, required: true, type: string}}}
permissions: {contents: read}
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: write, packages: write, id-token: write, attestations: write}
    strategy: {fail-fast: true, matrix: {image: [api, collector, web]}}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, ref: "${{ inputs.tag || github.ref_name }}"}
      - name: Validate release tag and version
        env: {RELEASE_TAG: "${{ inputs.tag || github.ref_name }}"}
        run: |
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "invalid release tag: $RELEASE_TAG" >&2; exit 1;; esac
          test "v$(cat VERSION)" = "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.image == 'web' && 'web' || '.' }}"
          file: "${{ matrix.image == 'web' && 'web/Dockerfile' || format('Dockerfile.{0}', matrix.image) }}"
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: "ghcr.io/thiagomontozo/infragraph-${{ matrix.image }}:${{ inputs.tag || github.ref_name }}"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless sign
        env: {DIGEST: "${{ steps.build.outputs.digest }}", IMAGE: "ghcr.io/thiagomontozo/infragraph-${{ matrix.image }}"}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: anchore/sbom-action@v0.24.0
        with: {image: "ghcr.io/thiagomontozo/infragraph-${{ matrix.image }}@${{ steps.build.outputs.digest }}", format: spdx-json, output-file: "infragraph-${{ matrix.image }}.spdx.json"}
      - uses: actions/attest-build-provenance@v4
        with: {subject-name: "ghcr.io/thiagomontozo/infragraph-${{ matrix.image }}", subject-digest: "${{ steps.build.outputs.digest }}", push-to-registry: true}
      - name: Checksums
        run: sha256sum "infragraph-${{ matrix.image }}.spdx.json" > "infragraph-${{ matrix.image }}.checksums.txt"
      - uses: softprops/action-gh-release@v3
        with: {tag_name: "${{ inputs.tag || github.ref_name }}", generate_release_notes: true, files: "infragraph-${{ matrix.image }}.*"}

