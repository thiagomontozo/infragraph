name: Security
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: '23 4 * * 2'}]
permissions: {contents: read, security-events: write}
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod, cache: true}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./cmd/... ./internal/...
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: CRITICAL, exit-code: '1', ignore-unfixed: true}
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy: {fail-fast: false, matrix: {image: [api, collector, web]}}
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          if [ "${{ matrix.image }}" = web ]; then docker build -f web/Dockerfile -t "infragraph-${{ matrix.image }}:scan" web; else docker build -f "Dockerfile.${{ matrix.image }}" -t "infragraph-${{ matrix.image }}:scan" .; fi
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "infragraph-${{ matrix.image }}:scan", severity: CRITICAL, exit-code: '1', ignore-unfixed: true}
