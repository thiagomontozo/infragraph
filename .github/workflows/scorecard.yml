name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule: [{cron: '17 5 * * 3'}]
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {security-events: write, id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: ossf/scorecard-action@v2.4.3
        with: {results_file: results.sarif, results_format: sarif, publish_results: true}
      - uses: github/codeql-action/upload-sarif@v4
        with: {sarif_file: results.sarif}
      - uses: actions/upload-artifact@v4
        with: {name: scorecard-results, path: results.sarif, retention-days: 14}

