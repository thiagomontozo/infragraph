name: infragraph-dev
services:
  postgres:
    image: postgres:17.6-alpine3.22
    labels: {com.infragraph.managed: "true", com.infragraph.purpose: "development"}
    environment: {POSTGRES_DB: infragraph, POSTGRES_USER: infragraph, POSTGRES_PASSWORD: infragraph}
    volumes: [infragraph-postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U infragraph"], interval: 5s, timeout: 3s, retries: 20}
    deploy: {resources: {limits: {memory: 512M, cpus: "1.0"}}}
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    labels: {com.infragraph.managed: "true", com.infragraph.purpose: "development"}
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: infragraph, MINIO_ROOT_PASSWORD: development-minio-change-me}
    volumes: [infragraph-minio:/data]
    healthcheck: {test: [CMD, mc, ready, local], interval: 5s, timeout: 3s, retries: 20}
    deploy: {resources: {limits: {memory: 384M, cpus: "0.5"}}}
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: [/bin/sh, -c]
    command: ["mc alias set local http://minio:9000 infragraph development-minio-change-me && mc mb --ignore-existing local/infragraph"]
    labels: {com.infragraph.managed: "true", com.infragraph.purpose: "development"}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    labels: {com.infragraph.managed: "true", com.infragraph.purpose: "development"}
    depends_on: {postgres: {condition: service_healthy}, minio-init: {condition: service_completed_successfully}}
    environment:
      INFRAGRAPH_ENV: development
      INFRAGRAPH_HTTP_ADDR: :8080
      INFRAGRAPH_DATABASE_URL: postgres://infragraph:infragraph@postgres:5432/infragraph?sslmode=disable
      INFRAGRAPH_SESSION_SECRET: development-only-change-me-32-bytes
      INFRAGRAPH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INFRAGRAPH_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      INFRAGRAPH_OBJECT_STORAGE_TYPE: s3
      INFRAGRAPH_S3_ENDPOINT: minio:9000
      INFRAGRAPH_S3_BUCKET: infragraph
      INFRAGRAPH_S3_ACCESS_KEY: infragraph
      INFRAGRAPH_S3_SECRET_KEY: development-minio-change-me
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 256M, cpus: "0.5"}}}
  web:
    build: ./web
    labels: {com.infragraph.managed: "true", com.infragraph.purpose: "development"}
    depends_on: [api]
    ports: ["5173:8080"]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 128M, cpus: "0.25"}}}
  collector:
    profiles: [collector]
    build: {context: ., dockerfile: Dockerfile.collector}
    labels: {com.infragraph.managed: "true", com.infragraph.purpose: "development"}
    environment:
      INFRAGRAPH_CONTROL_PLANE_URL: http://api:8080
      INFRAGRAPH_DOCKER_SOCKET: /var/run/docker.sock
      INFRAGRAPH_DOCKER_LABEL_SCOPE: com.infragraph.test=true
    volumes: [/var/run/docker.sock:/var/run/docker.sock, infragraph-collector:/data/collector]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 128M, cpus: "0.25"}}}
volumes:
  infragraph-postgres: {}
  infragraph-minio: {}
  infragraph-collector: {}
